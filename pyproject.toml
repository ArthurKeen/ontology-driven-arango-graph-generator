[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-driven-arango-graph-generator"
dynamic = ["version"]
description = "Transform OWL/RDF ontologies into ArangoDB graph models."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Arthur Keen" }
]
keywords = ["arangodb", "ontology", "rdf", "owl", "graph"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "rdflib>=6.0.0",
  "arango-rdf>=2.0.0",
  "python-arango>=8.0.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  # Pinned so formatter upgrades cannot break CI unexpectedly
  "ruff==0.17.2",
]

[project.urls]
Homepage = "https://github.com/arango-solutions-org/ontology-driven-arango-graph-generator"
Issues = "https://github.com/arango-solutions-org/ontology-driven-arango-graph-generator/issues"

[project.scripts]
ontology-transform = "ontology_graph_generator.cli:main"
ontology-env = "ontology_graph_generator.environment:main"

[tool.setuptools.dynamic]
version = { attr = "ontology_graph_generator.__version__" }

[tool.setuptools.packages.find]
include = ["ontology_graph_generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs a live ArangoDB (set ARANGO_TEST_ENDPOINT and ARANGO_TEST_PASSWORD)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
