services:
  arangodb:
    image: arangodb:latest
    container_name: ontology-arango
    environment:
      ARANGO_ROOT_PASSWORD: change-me
    ports:
      - "8529:8529"
    volumes:
      - arangodb-data:/var/lib/arangodb3
      - arangodb-apps:/var/lib/arangodb3-apps

volumes:
  arangodb-data:
  arangodb-apps:
