services:
  arangodb:
    image: arangodb:3.12.11
    container_name: ontology-arango
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_ROOT_PASSWORD:-change-me}
    ports:
      # Override with ARANGO_PORT if 8529 is already in use on your machine
      - "${ARANGO_PORT:-8529}:8529"
    volumes:
      - arangodb-data:/var/lib/arangodb3
      - arangodb-apps:/var/lib/arangodb3-apps

volumes:
  arangodb-data:
  arangodb-apps:
